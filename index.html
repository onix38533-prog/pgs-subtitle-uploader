<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PGS Subtitle Uploader</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark">PGS</div>
      <div><p class="eyebrow">PRIVATE SUBTITLE LIBRARY</p><h1>مكتبة ترجمات PGS</h1><p class="muted">ارفع ملفات SUP الأصلية وأدر مكتبتك الخاصة.</p></div>
    </header>
    <section class="panel">
      <div class="section-head"><div><p class="eyebrow">UPLOAD</p><h2>إضافة ترجمة</h2></div><span class="pill">.SUP فقط</span></div>
      <form id="uploadForm">
        <label class="drop" for="file"><span class="upload-icon">↑</span><strong id="fileName">اختر ملف الترجمة أو اسحبه هنا</strong><small>لن يتم تحويل الملف أو تعديل محتواه</small><input id="file" name="file" type="file" accept=".sup" required></label>
        <div class="fields">
          <label>نوع المحتوى<select name="type" id="type"><option value="movie">فيلم</option><option value="series">مسلسل</option></select></label>
          <label>IMDb ID<input name="imdbId" placeholder="tt1234567" pattern="tt[0-9]{5,12}" required></label>
          <label>اللغة<select name="lang"><option value="ara">العربية</option><option value="eng">الإنجليزية</option><option value="und">غير محددة</option></select></label>
          <label>اسم الترجمة<input name="label" value="PGS Arabic" maxlength="80"></label>
          <label class="episode">الموسم<input name="season" type="number" min="1" value="1"></label>
          <label class="episode">الحلقة<input name="episode" type="number" min="1" value="1"></label>
        </div>
        <button type="submit" id="submit">رفع الترجمة</button><p id="message" class="message"></p>
      </form>
    </section>
    <section class="panel">
      <div class="section-head"><div><p class="eyebrow">YOUR COLLECTION</p><h2>الترجمات المرفوعة</h2></div><button class="subtle" id="refresh">تحديث</button></div>
      <div id="items" class="items"><p class="muted">جارٍ تحميل المكتبة...</p></div>
    </section>
    <footer>PGS Subtitle Uploader <span>نسخة أولية 0.1.0</span></footer>
  </main>
  <script src="/assets/app.js"></script>
</body></html>
